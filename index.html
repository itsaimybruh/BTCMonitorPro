<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Portfolio Tracker - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .table-input { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 4px 8px; border-radius: 6px; width: 100%; font-family: monospace; }
        .table-input:focus { border-color: #38bdf8; outline: none; background: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-extrabold gradient-text italic">BTC Monitor Pro</h1>
                <p class="text-slate-400 text-sm">Sincronizzazione Cloud GitHub • EUR</p>
            </div>
            <div class="flex gap-2">
                <button onclick="saveToGitHub()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 px-6 rounded-2xl transition shadow-lg flex items-center gap-2">
                    <i class="fas fa-cloud-upload-alt"></i> SALVA SU CLOUD
                </button>
                <div class="glass px-6 py-3 rounded-2xl flex items-center gap-4">
                    <span id="btc-price" class="text-2xl font-mono font-bold text-blue-400">0,00 €</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="glass p-6 rounded-3xl border-t-4 border-blue-500">
                <p class="text-slate-400 text-xs font-bold uppercase mb-2">Valore Totale</p>
                <p id="total-value" class="text-3xl font-bold italic">0,00 €</p>
            </div>
            <div class="glass p-6 rounded-3xl border-t-4 border-indigo-500">
                <p class="text-slate-400 text-xs font-bold uppercase mb-2">Profitto Netto</p>
                <p id="total-profit" class="text-3xl font-bold">0,00 €</p>
            </div>
            <div class="glass p-6 rounded-3xl border-t-4 border-emerald-500">
                <p class="text-slate-400 text-xs font-bold uppercase mb-2">ROI Totale</p>
                <p id="total-roi" class="text-3xl font-bold">0,00%</p>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 px-2">
            <h2 class="text-xl font-bold gradient-text italic">Gestione Acquisti</h2>
            <button onclick="addNewPurchase()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded-xl shadow-lg">
                <i class="fas fa-plus mr-2"></i> Aggiungi
            </button>
        </div>

        <div class="glass rounded-3xl overflow-hidden mb-6">
            <table class="w-full text-left">
                <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase italic">
                    <tr>
                        <th class="p-5">Acquisto</th>
                        <th class="p-5">BTC</th>
                        <th class="p-5 text-center">Costo Tot. (€)</th>
                        <th class="p-5 text-center">Valore (€)</th>
                        <th class="p-5 text-right">ROI %</th>
                        <th class="p-5 text-center"></th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="glass rounded-3xl p-6 mb-10 border-t-4 border-cyan-500">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="flex-1">
                    <h2 class="text-xl font-bold gradient-text italic mb-1">CASH</h2>
                    <p class="text-slate-400 text-xs font-bold tracking-wider">DISPONIBILITÀ SU EXCHANGE (€)</p>
                </div>
                <div class="flex items-center gap-4 bg-slate-800/50 p-3 rounded-2xl border border-slate-700">
                    <input type="number" id="cash-input" oninput="updateData()" class="bg-transparent text-2xl font-mono font-bold text-cyan-400 focus:outline-none w-32">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="cash-subtract-toggle" onchange="updateData()" class="mr-2">
                        <span class="text-xs font-bold text-slate-400">SOTTRAI DAI TOTALI</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        let purchases = [];
        const REPO = "itsaimybruh/BTCMonitorPro"; // CAMBIA QUESTO
        const DATA_PATH = "user_data.json";

        async function init() {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${DATA_PATH}`);
                const data = await res.json();
                purchases = data.purchases || [];
                document.getElementById('cash-input').value = data.cashAmount || 0;
                document.getElementById('cash-subtract-toggle').checked = data.cashSubtract || false;
                updateData();
            } catch (e) {
                console.log("Inizializzazione con dati locali...");
                purchases = [{ id: 1, btc: 0.00320447, cost: 172.22, label: "Acquisto #1" }];
                updateData();
            }
        }

        async function saveToGitHub() {
            const token = prompt("Inserisci il tuo GitHub Personal Access Token:");
            if (!token) return;
            
            try {
                const getFile = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                const fileData = await getFile.json();
                const sha = fileData.sha;

                const content = {
                    purchases: purchases,
                    cashAmount: parseFloat(document.getElementById('cash-input').value) || 0,
                    cashSubtract: document.getElementById('cash-subtract-toggle').checked
                };

                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "Update via Dashboard",
                        content: btoa(JSON.stringify(content, null, 2)),
                        sha: sha
                    })
                });

                if (response.ok) alert("Sincronizzato!");
                else alert("Errore durante il salvataggio.");
            } catch (e) { alert("Errore di rete."); }
        }

        function addNewPurchase() {
            purchases.push({ id: Date.now(), btc: 0, cost: 0, label: `Acquisto #${purchases.length + 1}` });
            renderTable(lastPrice);
        }

        function removePurchase(id) {
            purchases = purchases.filter(p => p.id !== id);
            updateData();
        }

        let lastPrice = 0;
        const fmt = (v) => v.toLocaleString('it-IT', { minimumFractionDigits: 2 }) + ' €';

        async function updateData() {
            const res = await fetch('https://api.coinbase.com/v2/prices/BTC-EUR/spot');
            const data = await res.json();
            lastPrice = parseFloat(data.data.amount);
            document.getElementById('btc-price').innerText = fmt(lastPrice);

            let totalBtcValue = purchases.reduce((s, p) => s + (p.btc * lastPrice), 0) + 2.00;
            let totalCost = purchases.reduce((s, p) => s + p.cost, 0);
            let cash = parseFloat(document.getElementById('cash-input').value) || 0;
            
            if (document.getElementById('cash-subtract-toggle').checked) {
                totalBtcValue -= cash;
            }

            const profit = totalBtcValue - totalCost;
            const roi = totalCost > 0 ? (profit / totalCost) * 100 : 0;

            document.getElementById('total-value').innerText = fmt(totalBtcValue);
            document.getElementById('total-profit').innerHTML = `<span class="${profit >= 0 ? 'text-emerald-400' : 'text-red-400'}">${fmt(profit)}</span>`;
            document.getElementById('total-roi').innerHTML = `<span class="${roi >= 0 ? 'text-emerald-400' : 'text-red-400'}">${roi.toFixed(2)}%</span>`;
            
            renderTable(lastPrice);
        }

        function renderTable(price) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            purchases.forEach(p => {
                const val = p.btc * price;
                const roi = p.cost > 0 ? ((val - p.cost)/p.cost)*100 : 0;
                tbody.innerHTML += `
                    <tr class="border-t border-slate-700/50">
                        <td class="p-5 font-bold text-blue-300">${p.label}</td>
                        <td class="p-5"><input type="number" value="${p.btc}" oninput="p.btc=parseFloat(this.value)||0;updateData()" class="table-input"></td>
                        <td class="p-5"><input type="number" value="${p.cost}" oninput="p.cost=parseFloat(this.value)||0;updateData()" class="table-input"></td>
                        <td class="p-5 text-center">${fmt(val)}</td>
                        <td class="p-5 text-right font-bold ${roi>=0?'text-emerald-400':'text-red-400'}">${roi.toFixed(2)}%</td>
                        <td class="p-5"><button onclick="removePurchase(${p.id})"><i class="fas fa-times"></i></button></td>
                    </tr>`;
            });
        }
        init();
        setInterval(updateData, 5000);
    </script>
</body>
</html>
